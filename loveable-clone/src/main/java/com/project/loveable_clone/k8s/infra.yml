apiVersion: v1
kind: Namespace
metadata:
  name: shuttle-apps #cluster-name

---
#later this service will be move inside a single cluster. For the time this will connect to the minio container running locally/inside container.
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: shuttle-apps
spec:
  type: ExternalName
  externalName: host.docker.internal #points to the localhost/laptop; basically if minio is running in a container with port forwarded the it will connect using that.
  ports:
    - port: 9000 #it should be the same API port in docker-compose used to run the minio/also used in the application.yml
      targetPort: 9000
      protocol: TCP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-server
  namespace: shuttle-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

---

apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: shuttle-apps
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP

